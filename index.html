    if(!hasSeenIngredients){
      setHasSeenIngredients(true);
      db.save("mebau_seen_ing_v3",true);
    }
  };

  const updateDishes=(upd)=>{ setDishes(upd); db.save("mebau_dishes_v3",upd); };

  const updateCookedDishes=(upd)=>{ setCookedDishes(upd); db.save("mebau_cooked_v3",upd); };

  const updateFavoriteDishes=(upd)=>{ setFavoriteDishes(upd); db.save("mebau_fav_v3",upd); };

  const toggleFavDish=(dish)=>{
    const updated = favoriteDishes.includes(dish)
      ? favoriteDishes.filter(d=>d!==dish)
      : [...favoriteDishes, dish];
    updateFavoriteDishes(updated);
  };

  const saveDishRecipe=(dishName, recipe)=>{
    const upd = {...dishRecipes, [dishName]: recipe};
    setDishRecipes(upd);
    db.save("mebau_recipes_v3", upd);
  };

  const addDishWithRecipe=(name, recipe)=>{
    updateDishes([...dishes, name]);
    if(recipe) saveDishRecipe(name, recipe);
  };

  const saveDiaryEntry=(dk, entry)=>{
    const upd = {...diary, [dk]: entry};
    setDiary(upd);
    db.save("mebau_diary_v3", upd);
  };

  const deleteDiaryEntry=(dk)=>{
    const upd = {...diary};
    delete upd[dk];
    setDiary(upd);
    db.save("mebau_diary_v3", upd);
  };

  const toggleCookedDish=(dish)=>{
    const updated = cookedDishes.includes(dish)
      ? cookedDishes.filter(d=>d!==dish)
      : [...cookedDishes, dish];
    updateCookedDishes(updated);
  };

  const addDishToMeal=(dayNum, mealKey, dishName)=>{
    const newPlan={...plan, days:plan.days.map(d=>{
      if(d.day!==dayNum) return d;
      const raw=d[mealKey]; const arr=Array.isArray(raw)?[...raw]:(raw?[raw]:[]);
      return {...d,[mealKey]:[...arr,dishName]};
    })};
    setPlan(newPlan); db.save("mebau_plan_v3",newPlan);
  };

  const removeDishFromMeal=(dayNum, mealKey, dishIndex)=>{
    const newPlan={...plan, days:plan.days.map(d=>{
      if(d.day!==dayNum) return d;
      const raw=d[mealKey]; const arr=Array.isArray(raw)?[...raw]:(raw?[raw]:[]);
      arr.splice(dishIndex,1);
      return {...d,[mealKey]:arr};
    })};
    setPlan(newPlan); db.save("mebau_plan_v3",newPlan);
  };

  const deletePlanFromHistory=(idx)=>{
    const newHist=history.filter((_,i)=>i!==idx);
    setHistory(newHist); db.save("mebau_hist_v3",newHist);
  };

  const clearHistory=()=>{
    setHistory([]); db.save("mebau_hist_v3",[]);
  };

  const restorePlan=(p)=>{
    setPlan(p); db.save("mebau_plan_v3",p); setTab("menu");
  };

  const replaceDish=(dayNum, mealKey, dishIndex, newDish, oldDish)=>{
    const newPlan = {
      days: plan.days.map(d=>{
        if(d.day!==dayNum) return d;
        const mealRaw = d[mealKey];
        const meal = Array.isArray(mealRaw)?[...mealRaw]:[mealRaw];
        meal[dishIndex] = newDish;
        return {...d, [mealKey]: meal};
      })
    };
    setPlan(newPlan);
    db.save("mebau_plan_v3", newPlan);
    // Mark the selected dish as cooked (what user will actually cook today)
    if(newDish&&!cookedDishes.includes(newDish)){
      updateCookedDishes([...cookedDishes, newDish]);
    }
  };

  // ── Kiểm tra kho món ăn trước khi tạo thực đơn ──────────────────────────────
  const checkDishesAndGenerate = (onlyFavs=false, onlyAvailIng=false, sameMeal=false, startDateKey=null)=>{
    const activeDishes = onlyFavs ? favoriteDishes : dishes;
    const MIN_DISHES = 8; // Cần ít nhất 8 món để lên thực đơn đa dạng

    // Phân tích đa dạng: tối thiểu 3 loại (mặn, canh/rau, hạt/tráng miệng)
    const hasSavory = activeDishes.some(d=>{
      const dl=d.toLowerCase();
      return dl.includes("kho")||dl.includes("chiên")||dl.includes("xào")||dl.includes("luộc")||dl.includes("hấp")||dl.includes("hầm")||dl.includes("áp chảo")||dl.includes("rang");
    });
    const hasSoup = activeDishes.some(d=>d.toLowerCase().includes("canh")||d.toLowerCase().includes("súp")||d.toLowerCase().includes("cháo"));
    const hasNut = activeDishes.some(d=>{
      const dl=d.toLowerCase();
      return dl.includes("hạt")||dl.includes("đậu")||dl.includes("sữa")||dl.includes("chè");
    });
    const hasFruit = activeDishes.some(d=>{
      const dl=d.toLowerCase();
      return dl.includes("cam")||dl.includes("chuối")||dl.includes("táo")||dl.includes("nho")||dl.includes("kiwi")||dl.includes("dâu")||dl.includes("lựu")||dl.includes("bơ")||dl.includes("trái cây")||dl.includes("lê")||dl.includes("ổi")||dl.includes("thanh long")||dl.includes("dưa");
    });

    const missing = [];
    if(activeDishes.length < MIN_DISHES) missing.push(`chưa đủ số lượng (${activeDishes.length}/${MIN_DISHES} món)`);
    if(!hasSavory) missing.push("thiếu món mặn (kho/chiên/xào/luộc)");
    if(!hasSoup) missing.push("thiếu canh/súp/cháo");
    if(!hasNut) missing.push("thiếu hạt/đậu/sữa hạt");
    if(!hasFruit) missing.push("thiếu trái cây");

    if(missing.length > 0) {
      setDishWarning({missing, onlyFavs, onlyAvailIng, sameMeal, startDateKey});
    } else {
      generatePlan(onlyFavs, onlyAvailIng, sameMeal, startDateKey);
    }
  };

  const generatePlan = async(onlyFavs=false, onlyAvailIng=false, sameMeal=false, startDateKey=null)=>{
    if(!groqKey.trim()){
      alert("Vui lòng nhập Groq API Key trước!\n\nLấy miễn phí tại: console.groq.com/keys");
      return;
    }
    if(!hasSeenIngredients){
      alert("Vui lòng vào tab Nguyên liệu và tích chọn những nguyên liệu bạn có sẵn trước!");
      setTab("ingredients");
      return;
    }
    if(onlyFavs && favoriteDishes.length===0){
      alert("Chưa có món ăn yêu thích nào!\n\nVào tab Món ăn, nhấn ⭐ để thêm món vào danh sách yêu thích trước nhé.");
      return;
    }

    setLoading(true);
    try {
      const available = ingredients.filter(i=>i.available).map(i=>`${i.name}(${i.category})`).join(", ");

      // Flatten recent meals from history (support both string and array formats)
      const recentMeals = history.slice(-2).flatMap(p=>p.days||[]).flatMap(d=>{
        const flatten=(v)=>Array.isArray(v)?v:[v||""];
        return [...flatten(d.breakfast),...flatten(d.lunch),...flatten(d.dinner)];
      }).filter(Boolean).join(", ");

      const cooked = cookedDishes.slice(-30).join(", ");

      // Pull diary from last 14 days
      const diaryLines = Object.entries(diary)
        .sort((a,b)=>b[0].localeCompare(a[0]))
        .slice(0,14)
        .map(([dk,e])=>{
          const parts=[];
          if(e.breakfast) parts.push(`sáng: ${e.breakfast}`);
          if(e.lunch) parts.push(`trưa: ${e.lunch}`);
          if(e.dinner) parts.push(`tối: ${e.dinner}`);
          return `${dk} (${parts.join(" | ")})`;
        }).join("\n");

      const prompt = `Lên thực đơn ${numDays} ngày cho mẹ bầu 3 tháng đầu.

Nguyên liệu hiện có: ${available}
Không lặp các món sau: ${recentMeals||"Chưa có"}
Đã nấu rồi (tránh dùng nếu có thể): ${cooked||"Chưa có"}
${diaryLines ? `\nLịch sử ăn uống thực tế gần đây (tránh lặp):\n${diaryLines}` : ""}

QUY TẮC TỪNG BỮA (BẮT BUỘC):
- 1 MÓN MẶN bắt buộc: xào / chiên / kho / luộc / hấp / áp chảo (cá, thịt, trứng, đậu khuôn...)
- 1 MÓN CANH hoặc RAU: nếu là "canh rau" (canh rau ngót, canh cải, canh bí...) thì KHÔNG cần thêm món rau riêng; nếu là canh xương/thịt thì cần thêm 1 món rau xào/luộc
- 1 TRÁI CÂY: ghi tên cụ thể (cam, chuối, táo, nho, kiwi...)
- CƠM TRẮNG: bữa trưa và bữa tối PHẢI thêm "Cơm trắng" vào mảng; bữa sáng không cần cơm (ăn cháo/súp hoặc nhẹ là đủ)

QUY TẮC TỪNG NGÀY (BẮT BUỘC):
- ĐÚNG 1 trong 3 bữa phải có thêm MÓN HẠT/ĐẬU: sữa đậu xanh, sữa đậu nành, chè đậu đen, chè đậu đỏ, hạt điều rang, sữa hạt óc chó... (các bữa còn lại không có)
- Đa dạng protein mỗi ngày: không lặp cùng loại (cá/thịt/trứng/đậu xen kẽ)
- Bữa sáng có thể nhẹ hơn (2-3 món), bữa trưa/tối đầy đủ hơn (3-4 món)
- BẮT BUỘC: Chỉ chọn món từ danh sách kho món ăn sau đây (KHÔNG ĐƯỢC tự đặt tên món ngoài danh sách này): ${(onlyFavs ? favoriteDishes : dishes).join(", ")||"Chưa có món nào"}
${sameMeal?"- BẮT BUỘC: Bữa SÁNG phải có các món GIỐNG HỆT bữa TRƯA (cùng tên món, không thay đổi).\n":""}${onlyFavs ? "- BẮT BUỘC: chỉ dùng các món trong danh sách yêu thích trên, KHÔNG được dùng món ngoài danh sách này.\n" : ""}${onlyAvailIng ? "- BẮT BUỘC: chỉ tạo món từ các nguyên liệu có trong danh sách 'Nguyên liệu hiện có' ở trên, TUYỆT ĐỐI không dùng nguyên liệu ngoài danh sách đó.\n" : ""}

CHỈ trả về JSON hợp lệ (không markdown, không giải thích):
{"days":[{"day":1,"breakfast":["tên món mặn","tên canh hoặc rau","tên trái cây"],"lunch":["Cơm trắng","tên món mặn","tên rau","tên canh","tên trái cây"],"dinner":["Cơm trắng","tên món mặn","tên món hạt/đậu","tên canh hoặc rau","tên trái cây"],"note":"ghi chú dinh dưỡng 1 câu"}],"shopping_list":{"Thịt & cá":[],"Rau củ":[],"Hạt & đậu":[],"Trái cây":[]}}`;

      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+groqKey.trim()},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile",
          max_tokens:2800,
          temperature:0.75,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng cho mẹ bầu 3 tháng đầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick, không giải thích thêm bất kỳ điều gì."},
            {role:"user",content:prompt}
          ]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"Lỗi Groq API");
      const text = data.choices?.[0]?.message?.content||"";
      const cleaned = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(cleaned);
      const newPlan = {...parsed, generatedAt:new Date().toISOString(), numDays, startDateKey};
      // Enforce breakfast = lunch on client side if sameMeal is on
      if(sameMeal && newPlan.days) {
        newPlan.days = newPlan.days.map(d=>({...d, breakfast: Array.isArray(d.lunch)?[...d.lunch]:[d.lunch].filter(Boolean)}));
      }
      const newHist = [...history, newPlan].slice(-10);
      setHistory(newHist); setPlan(newPlan);
      db.save("mebau_plan_v3", newPlan);
      db.save("mebau_hist_v3", newHist);

      // ── Lưu thực đơn vào lịch (diary) theo ngày bắt đầu ──────────────────
      if(startDateKey && newPlan.days) {
        const [sy,sm,sd] = startDateKey.split("-").map(Number);
        const startDate = new Date(sy, sm-1, sd);
        const newDiary = {...diary};
        newPlan.days.forEach((dayObj, idx)=>{
          const dt = new Date(startDate);
          dt.setDate(startDate.getDate() + idx);
          const dk = dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
          const flatten = v=>Array.isArray(v)?v:(v?[v]:[]);
          const bf = flatten(dayObj.breakfast).filter(d=>d&&d!=="Cơm trắng").join(", ");
          const lu = flatten(dayObj.lunch).join(", ");
          const di_ = flatten(dayObj.dinner).join(", ");
          newDiary[dk] = {
            breakfast: bf,
            lunch: lu,
            dinner: di_,
            note: dayObj.note||"",
            fromMenu: true
          };
        });
        setDiary(newDiary);
        db.save("mebau_diary_v3", newDiary);
      }

      setTab("menu");
    } catch(e){
      console.error(e);
      alert("Có lỗi: "+e.message+"\n\nKiểm tra lại API Key và kết nối mạng.");
    }
    setLoading(false);
  };

  const filteredIng = catFilter==="Tất cả"?ingredients:ingredients.filter(i=>i.category===catFilter);
  const availCount = ingredients.filter(i=>i.available).length;
  const tabs=[
    {id:"menu",icon:"🍽️",label:"Thực đơn"},
    {id:"ingredients",icon:"🥦",label:"Nguyên liệu"},
    {id:"dishes",icon:"🍜",label:"Món ăn"},
    {id:"calendar",icon:"📅",label:"Nhật ký"},
    {id:"history",icon:"📜",label:"Lịch sử"},
  ];

  const handleTabChange=(t)=>{
    setTab(t);
  };

  return (
    <div style={{background:C.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",fontFamily:"'Nunito',sans-serif",paddingBottom:90}}>
      {/* Header */}
      <div style={{background:`linear-gradient(160deg,${C.green} 0%,${C.greenDk} 100%)`,padding:"24px 20px 58px",borderRadius:"0 0 36px 36px",position:"relative"}}>
        <div style={{color:"rgba(255,255,255,0.75)",fontSize:11,fontWeight:700,letterSpacing:1.2,textTransform:"uppercase",marginBottom:4}}>
          🌿 Thực đơn gia đình
        </div>
        {/* Clickable stage selector */}
        <div style={{position:"relative"}} data-stage-menu="1">
          <button
            onClick={()=>setShowStageMenu(v=>!v)}
            style={{background:"none",border:"none",padding:0,cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"'Nunito',sans-serif"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{color:"white",fontSize:24,fontWeight:900,lineHeight:1.2}}>
                {STAGES.find(s=>s.id===stage)?.label||"3 tháng đầu thai kỳ"}
              </div>
              <div style={{color:"rgba(255,255,255,0.7)",fontSize:14,marginTop:2}}>▼</div>
            </div>
          </button>
          {showStageMenu&&(
            <div style={{position:"absolute",top:"110%",left:0,background:"white",borderRadius:18,boxShadow:"0 8px 32px rgba(0,0,0,0.18)",zIndex:200,minWidth:260,overflow:"hidden",animation:"fadeIn 0.15s ease"}}>
              {STAGES.map(s=>(
                <button key={s.id} onClick={()=>{setStage(s.id);setShowStageMenu(false);}}
                  style={{width:"100%",background:stage===s.id?C.greenLt:"white",border:"none",padding:"13px 18px",fontFamily:"'Nunito',sans-serif",fontSize:14,fontWeight:stage===s.id?800:600,color:stage===s.id?C.greenDk:C.brown,cursor:"pointer",display:"flex",alignItems:"center",gap:10,textAlign:"left",borderBottom:`1px solid ${C.border}`,transition:"background 0.12s"}}>
                  <span style={{fontSize:18}}>{s.icon}</span>
                  {s.label}
                  {stage===s.id&&<span style={{marginLeft:"auto",color:C.green,fontSize:16}}>✓</span>}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{color:"rgba(255,255,255,0.65)",fontSize:13,marginTop:5}}>
          {availCount}/{ingredients.length} nguyên liệu có sẵn · {dishes.length} món ăn
          {history.length>0&&<span> · {history.length} đợt thực đơn</span>}
          {Object.keys(diary).length>0&&<span> · {Object.keys(diary).length} ngày trong lịch</span>}
        </div>
      </div>

      {/* Tab Content */}
      <div style={{padding:"0 16px",marginTop:-38}}>
        {tab==="menu"&&(
          <MenuTab
            plan={plan} loading={loading} numDays={numDays} setNumDays={setNumDays}
            generatePlan={generatePlan} checkDishesAndGenerate={checkDishesAndGenerate} history={history}
            geminiKey={groqKey} setGeminiKey={saveKey} showKey={showKey} setShowKey={setShowKey}
            dishes={dishes} cookedDishes={cookedDishes} onReplaceDish={replaceDish}
            onDishClick={setSelectedDish}
            favoriteDishes={favoriteDishes}
            ingredients={ingredients}
            onAddDish={addDishToMeal}
            onRemoveDish={removeDishFromMeal}
          />
        )}
        {tab==="ingredients"&&(
          <IngredientsTab
            ingredients={filteredIng} allIng={ingredients}
            catFilter={catFilter} setCatFilter={setCatFilter}
            toggleIng={(id)=>updateIng(ingredients.map(i=>i.id===id?{...i,available:!i.available}:i))}
            markAllAvailable={()=>updateIng(ingredients.map(i=>({...i,available:true})))}
            markAllUnavailable={()=>updateIng(ingredients.map(i=>({...i,available:false})))}
            newIngName={newIngName} setNewIngName={setNewIngName}
            newIngCat={newIngCat} setNewIngCat={setNewIngCat}
            addIngredient={()=>{if(!newIngName.trim())return;updateIng([...ingredients,{id:`c${Date.now()}`,category:newIngCat,name:newIngName.trim(),available:true}]);setNewIngName("");}}
            hasSeenIngredients={hasSeenIngredients}
            apiKey={groqKey}
          />
        )}
        {tab==="dishes"&&(
          <DishesTab
            dishes={dishes} cookedDishes={cookedDishes}
            removeDish={(i)=>updateDishes(dishes.filter((_,j)=>j!==i))}
            onDishClick={setSelectedDish}
            onToggleCooked={toggleCookedDish}
            onAddDish={addDishWithRecipe}
            favoriteDishes={favoriteDishes}
            onToggleFav={toggleFavDish}
            ingredients={ingredients}
            apiKey={groqKey}
          />
        )}
        {tab==="calendar"&&(
          <CalendarTab
            diary={diary}
            dishes={dishes}
            onSave={saveDiaryEntry}
            onDelete={deleteDiaryEntry}
            apiKey={groqKey}
          />
        )}
        {tab==="history"&&(
          <HistoryTab
            history={history}
            onDelete={deletePlanFromHistory}
            onClearAll={clearHistory}
            onRestore={restorePlan}
          />
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"white",borderTop:`1px solid ${C.border}`,display:"flex",padding:"8px 0 18px",boxShadow:"0 -4px 20px rgba(0,0,0,0.08)",zIndex:100}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>handleTabChange(t.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",padding:"4px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:2,position:"relative"}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:tab===t.id?800:500,color:tab===t.id?C.green:C.muted,fontFamily:"inherit"}}>{t.label}</span>
            {/* Red dot for onboarding */}
            {t.id==="ingredients"&&!hasSeenIngredients&&(
              <div style={{position:"absolute",top:2,right:"calc(50% - 14px)",width:8,height:8,borderRadius:4,background:"#E85A5A",border:"2px solid white"}}/>
            )}
            {/* History badge */}
            {t.id==="history"&&history.length>0&&(
              <div style={{position:"absolute",top:2,right:"calc(50% - 16px)",background:C.green,borderRadius:10,minWidth:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",border:"2px solid white"}}>
                <span style={{fontSize:9,fontWeight:800,color:"white",padding:"0 3px"}}>{history.length}</span>
              </div>
            )}
            <div style={{width:tab===t.id?20:0,height:3,background:C.green,borderRadius:4,transition:"width 0.2s"}}/>
          </button>
        ))}
      </div>

      {/* Dish Recipe Modal */}
      {selectedDish&&(
        <DishRecipeModal dishName={selectedDish} apiKey={groqKey} dishRecipes={dishRecipes} onSaveRecipe={saveDishRecipe} onClose={()=>setSelectedDish(null)}/>
      )}

      {/* Dish Warning Modal */}
      {dishWarning&&(
        <DishWarningModal
          warning={dishWarning}
          onGoAdd={()=>{ setDishWarning(null); setTab("dishes"); }}
          onContinueAnyway={()=>{
            const w=dishWarning; setDishWarning(null);
            generatePlan(w.onlyFavs, w.onlyAvailIng, w.sameMeal, w.startDateKey);
          }}
          onClose={()=>setDishWarning(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
