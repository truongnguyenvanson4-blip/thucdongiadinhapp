// ─── Dish emoji helper ────────────────────────────────────────────────────────
function getDishEmoji(dish) {
  if(!dish) return "🍽️";
  const d = dish.toLowerCase();
  if(d.includes("sữa") || d.includes("chè") || d.includes("cháo đậu")) return "🥛";
  if(d.includes("canh") || d.includes("súp")) return "🥣";
  if(d.includes("xào")) return "🥘";
  if(d.includes("chiên") || d.includes("áp chảo")) return "🍳";
  if(d.includes("luộc")) return "♨️";
  if(d.includes("kho")) return "🫕";
  if(d.includes("hấp")) return "♨️";
  if(d.includes("hầm")) return "🍲";
  if(d.includes("cá")) return "🐟";
  if(d.includes("tôm")) return "🦐";
  if(d.includes("cam")||d.includes("chuối")||d.includes("táo")||d.includes("nho")||d.includes("kiwi")||d.includes("bơ")||d.includes("dâu")||d.includes("lựu")) return "🍊";
  if(d.includes("trái cây")||d.includes("quả")||d.includes("lê")||d.includes("ổi")||d.includes("vú sữa")||d.includes("thanh long")||d.includes("dưa")) return "🍎";
  if(d.includes("hạt")||d.includes("đậu")) return "🌰";
  if(d.includes("rau")) return "🥬";
  if(d.includes("cháo")) return "🍚";
  return "🍽️";
}

// ─── Dish Recipe Modal ────────────────────────────────────────────────────────
function DishRecipeModal({dishName, apiKey, dishRecipes, onSaveRecipe, onClose}) {
  const saved = dishRecipes&&dishRecipes[dishName];
  const [recipe, setRecipe] = useState(saved||null);
  const [loading, setLoading] = useState(!saved);
  const [error, setError] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [editNL, setEditNL] = useState("");
  const [editCN, setEditCN] = useState("");
  const [editLY, setEditLY] = useState("");

  useEffect(()=>{
    if(saved){ setRecipe(saved); setLoading(false); return; }
    if(!apiKey||!apiKey.trim()){
      setError("Cần nhập Groq API Key ở tab Thực đơn để xem công thức nấu.");
      setLoading(false);
      return;
    }
    fetchRecipe();
  },[dishName]);

  const fetchRecipe = async()=>{
    setLoading(true); setError(null);
    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile",
          max_tokens:900,
          temperature:0.4,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng và nấu ăn cho mẹ bầu 3 tháng đầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick, không giải thích."},
            {role:"user",content:`Cho công thức nấu món "${dishName}" phù hợp cho mẹ bầu 3 tháng đầu (2-3 khẩu phần). Trả về JSON: {"nguyen_lieu":["item 1","item 2"],"cach_nau":["Bước 1: mô tả","Bước 2: mô tả"],"luu_y":"lưu ý ngắn gọn cho mẹ bầu về dinh dưỡng và an toàn thực phẩm"}`}
          ]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"Lỗi API");
      const text = data.choices?.[0]?.message?.content||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setRecipe(parsed);
    } catch(e){
      setError("Không tải được công thức: "+e.message);
    }
    setLoading(false);
  };

  const openEdit = ()=>{
    setEditNL((recipe?.nguyen_lieu||[]).join("\n"));
    setEditCN((recipe?.cach_nau||[]).join("\n"));
    setEditLY(recipe?.luu_y||"");
    setEditMode(true);
  };

  const saveEdit = ()=>{
    const updated = {
      nguyen_lieu: editNL.split("\n").map(s=>s.trim()).filter(Boolean),
      cach_nau: editCN.split("\n").map(s=>s.trim()).filter(Boolean),
      luu_y: editLY.trim()
    };
    setRecipe(updated);
    onSaveRecipe&&onSaveRecipe(dishName, updated);
    setEditMode(false);
  };

  const taStyle = {width:"100%",border:`2px solid ${C.border}`,borderRadius:12,padding:"10px 12px",fontFamily:"inherit",fontSize:13,outline:"none",color:C.brown,resize:"vertical",minHeight:80,lineHeight:1.6};

  return (
    <div className="modal-overlay" onClick={e=>e.target.classList.contains("modal-overlay")&&onClose()}>
      <div className="modal-sheet">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{fontSize:22,marginBottom:2}}>{getDishEmoji(dishName)}</div>
            <div style={{fontSize:18,fontWeight:900,color:C.brown,lineHeight:1.2}}>{dishName}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {!loading&&!error&&!editMode&&(
              <button onClick={openEdit} style={{background:C.greenLt,border:"none",borderRadius:12,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:700,color:C.greenDk,fontFamily:"inherit"}}>✏️ Sửa</button>
            )}
            <button onClick={onClose} style={{background:"#F5F0EA",border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,flexShrink:0}}>×</button>
          </div>
        </div>

        {loading&&(
          <div style={{textAlign:"center",padding:"40px 0",color:C.muted}}>
            <div style={{fontSize:28,animation:"spin 1s linear infinite",display:"inline-block"}}>⏳</div>
            <div style={{marginTop:10,fontSize:14,fontWeight:600}}>Đang tải công thức...</div>
          </div>
        )}

        {error&&!loading&&(
          <div style={{background:"#FEF0F0",borderRadius:16,padding:16,color:"#C0392B",fontSize:14,fontWeight:600,lineHeight:1.6}}>{error}</div>
        )}

        {editMode&&(
          <div>
            <div style={{fontWeight:700,fontSize:13,color:C.brown,marginBottom:6}}>🧺 Nguyên liệu <span style={{fontWeight:400,color:C.muted}}>(mỗi dòng 1 nguyên liệu)</span></div>
            <textarea value={editNL} onChange={e=>setEditNL(e.target.value)} style={{...taStyle,marginBottom:12}} placeholder="VD: 300g thịt heo&#10;2 quả trứng&#10;1 muỗng nước mắm"/>
            <div style={{fontWeight:700,fontSize:13,color:C.brown,marginBottom:6}}>👩‍🍳 Cách nấu <span style={{fontWeight:400,color:C.muted}}>(mỗi dòng 1 bước)</span></div>
            <textarea value={editCN} onChange={e=>setEditCN(e.target.value)} style={{...taStyle,marginBottom:12}} placeholder="VD: Rửa sạch thịt, thái miếng&#10;Ướp thịt 15 phút&#10;Xào với lửa vừa..."/>
            <div style={{fontWeight:700,fontSize:13,color:C.brown,marginBottom:6}}>💡 Lưu ý mẹ bầu</div>
            <textarea value={editLY} onChange={e=>setEditLY(e.target.value)} style={{...taStyle,minHeight:50,marginBottom:16}} placeholder="Lưu ý về dinh dưỡng hoặc an toàn thực phẩm..."/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setEditMode(false)} style={{flex:1,background:"#F5F0EA",border:"none",borderRadius:12,padding:"12px",fontFamily:"inherit",fontWeight:700,fontSize:14,color:C.muted,cursor:"pointer"}}>Hủy</button>
              <button onClick={saveEdit} style={{flex:2,background:C.green,border:"none",borderRadius:12,padding:"12px",fontFamily:"inherit",fontWeight:700,fontSize:14,color:"white",cursor:"pointer"}}>💾 Lưu công thức</button>
            </div>
          </div>
        )}

        {recipe&&!loading&&!editMode&&(
          <>
            <div style={{background:C.greenLt,borderRadius:18,padding:16,marginBottom:14}}>
              <div style={{fontWeight:800,fontSize:14,color:C.greenDk,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
                🧺 Nguyên liệu
              </div>
              {(recipe.nguyen_lieu||[]).map((item,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:7}}>
                  <div style={{width:7,height:7,borderRadius:4,background:C.green,marginTop:6,flexShrink:0}}/>
                  <span style={{fontSize:14,color:C.brown,fontWeight:600,lineHeight:1.4}}>{item}</span>
                </div>
              ))}
            </div>

            <div style={{marginBottom:14}}>
              <div style={{fontWeight:800,fontSize:14,color:C.brown,marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
                👩‍🍳 Cách nấu
              </div>
              {(recipe.cach_nau||[]).map((step,i)=>(
                <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                  <div style={{width:28,height:28,borderRadius:9,background:C.green,color:"white",fontWeight:800,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                  <span style={{fontSize:14,color:C.brown,lineHeight:1.6,paddingTop:4}}>{step.replace(/^Bước \d+:\s*/,"")}</span>
                </div>
              ))}
            </div>

            {recipe.luu_y&&(
              <div style={{background:"#FFFBEA",borderRadius:16,padding:"12px 14px",borderLeft:"3px solid #E8C55A"}}>
                <div style={{fontWeight:700,fontSize:12,color:"#B8960A",marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>💡 Lưu ý mẹ bầu</div>
                <div style={{fontSize:13,color:"#6B5B2A",lineHeight:1.65}}>{recipe.luu_y}</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ─── Nutrition Panel (per day) ────────────────────────────────────────────────
function NutritionPanel({day, apiKey}) {
  const [nutrition, setNutrition] = useState(null);
  const [loading, setLoading] = useState(false);
  const [open, setOpen] = useState(false);

  const analyze = async()=>{
    if(!apiKey?.trim()){alert("Cần nhập Groq API Key ở phần tạo thực đơn!");return;}
    setLoading(true);
    const flatten=v=>Array.isArray(v)?v:(v?[v]:[]);
    const allDishes=[...flatten(day.breakfast),...flatten(day.lunch),...flatten(day.dinner)].filter(Boolean).join(", ");
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:600,temperature:0.3,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng mẹ bầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick."},
            {role:"user",content:`Phân tích giá trị dinh dưỡng thực đơn 1 ngày cho mẹ bầu 3 tháng đầu gồm: ${allDishes}. Đánh giá mức đáp ứng (đủ/thiếu/dư). Trả về JSON: {"protein":{"status":"đủ","note":"..."},"sat":{"status":"thiếu","note":"..."},"canxi":{"status":"đủ","note":"..."},"acid_folic":{"status":"đủ","note":"..."},"omega3":{"status":"thiếu","note":"..."},"vitamin_c":{"status":"đủ","note":"..."},"vitamin_d":{"status":"thiếu","note":"..."},"tong_ket":"nhận xét ngắn 1-2 câu"}`}
          ]
        })
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||"Lỗi API");
      const text=data.choices?.[0]?.message?.content||"";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setNutrition(parsed); setOpen(true);
    }catch(e){alert("Lỗi phân tích: "+e.message);}
    setLoading(false);
  };

  const sIcon=(s)=>s==="đủ"?"✅":s==="dư"?"⚠️":"❌";
  const sColor=(s)=>s==="đủ"?C.greenDk:s==="dư"?"#E8A020":"#C0392B";
  const sBg=(s)=>s==="đủ"?C.greenLt:s==="dư"?"#FFFBEA":"#FEF0F0";
  const nutrients=[
    {key:"protein",label:"Protein"},{key:"sat",label:"Sắt"},
    {key:"canxi",label:"Canxi"},{key:"acid_folic",label:"Axit Folic"},
    {key:"omega3",label:"Omega-3"},{key:"vitamin_c",label:"Vitamin C"},
    {key:"vitamin_d",label:"Vitamin D"},
  ];

  return (
    <div style={{marginTop:8}}>
      <button onClick={nutrition?()=>setOpen(!open):analyze} disabled={loading}
        style={{width:"100%",background:nutrition?sBg("đủ"):"linear-gradient(135deg,#7B6BAD,#5B4E8D)",color:nutrition?C.greenDk:"white",border:nutrition?`2px solid ${C.green}`:"none",borderRadius:12,padding:"9px",fontFamily:"inherit",fontWeight:700,fontSize:12,cursor:loading?"wait":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,transition:"all 0.2s"}}>
        {loading?<><span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⏳</span> Đang phân tích...</>
          :<>🔬 {nutrition?(open?"Thu gọn ▲":"Phân tích dinh dưỡng ▼"):"Phân tích dinh dưỡng ngày này"}</>}
      </button>
      {open&&nutrition&&(
        <div style={{background:"#F4F0FA",borderRadius:12,padding:"12px",marginTop:6,animation:"fadeIn 0.2s ease"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:8}}>
            {nutrients.map(n=>{
              const d=nutrition[n.key]; if(!d) return null;
              return(
                <div key={n.key} style={{background:"white",borderRadius:9,padding:"6px 9px",display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:13}}>{sIcon(d.status)}</span>
                  <div>
                    <div style={{fontSize:10,fontWeight:800,color:"#5B4E8D"}}>{n.label}</div>
                    <div style={{fontSize:10,color:sColor(d.status),fontWeight:700}}>{d.status}</div>
                  </div>
                </div>
              );
            })}
          </div>
          {nutrition.tong_ket&&(
            <div style={{background:"white",borderRadius:9,padding:"8px 10px",fontSize:11,color:"#5B4E8D",fontWeight:600,lineHeight:1.6}}>
              💡 {nutrition.tong_ket}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── 3-Day Nutrition Check ────────────────────────────────────────────────────
function ThreeDayNutritionCheck({plan, apiKey}) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [open, setOpen] = useState(false);

  const nDays = Math.min(3, plan?.days?.length||0);

  const check = async()=>{
    if(!apiKey?.trim()){alert("Cần nhập Groq API Key!");return;}
    if(!plan?.days?.length) return;
    setLoading(true);
    const flatten=v=>Array.isArray(v)?v:(v?[v]:[]);
    const last3=plan.days.slice(0,nDays);
    const mealSummary=last3.map(d=>{
      const all=[...flatten(d.breakfast),...flatten(d.lunch),...flatten(d.dinner)].filter(Boolean);
      return `Ngày ${d.day}: ${all.join(", ")}`;
    }).join("\n");
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:900,temperature:0.3,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng mẹ bầu. Chỉ trả về JSON hợp lệ, không markdown."},
            {role:"user",content:`Phân tích tổng hợp dinh dưỡng ${nDays} ngày cho mẹ bầu 3 tháng đầu:\n${mealSummary}\n\nĐánh giá xem tổng thể ${nDays} ngày có đủ dưỡng chất không. Trả về JSON: {"tong_quan":{"protein":{"du":true,"note":"..."},"sat":{"du":false,"note":"..."},"canxi":{"du":true,"note":"..."},"acid_folic":{"du":true,"note":"..."},"omega3":{"du":false,"note":"..."},"vitamin_c":{"du":true,"note":"..."},"chat_xo":{"du":true,"note":"..."}},"khuyen_nghi":["khuyến nghị 1","khuyến nghị 2","khuyến nghị 3"],"tong_ket":"nhận xét 2-3 câu"}`}
          ]
        })
      });
      const data=await res.json();
      if(data.error)throw new Error(data.error.message||"Lỗi API");
      const text=data.choices?.[0]?.message?.content||"";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setResult(parsed); setOpen(true);
    }catch(e){alert("Lỗi phân tích: "+e.message);}
    setLoading(false);
  };

  const nutrKeys=[
    {key:"protein",label:"Protein"},{key:"sat",label:"Sắt"},
    {key:"canxi",label:"Canxi"},{key:"acid_folic",label:"Axit Folic"},
    {key:"omega3",label:"Omega-3"},{key:"vitamin_c",label:"Vitamin C"},
    {key:"chat_xo",label:"Chất xơ"},
  ];

  return(
    <div style={{background:C.card,borderRadius:24,padding:20,marginTop:4,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:12}}>
      <div style={{fontWeight:800,fontSize:15,color:C.brown,marginBottom:2}}>🧬 Cân bằng dinh dưỡng {nDays} ngày</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:12}}>AI kiểm tra {nDays} ngày gần nhất có đủ dưỡng chất thiết yếu cho mẹ bầu không</div>
      <button onClick={result?()=>setOpen(!open):check} disabled={loading}
        style={{width:"100%",background:loading?"#B0C4B8":result?C.greenLt:`linear-gradient(135deg,${C.green},${C.greenDk})`,color:result?C.greenDk:"white",border:result?`2px solid ${C.green}`:"none",borderRadius:14,padding:"12px",fontFamily:"inherit",fontWeight:800,fontSize:14,cursor:loading?"wait":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
        {loading?<><span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⏳</span> Đang phân tích...</>
          :result?(open?"Thu gọn kết quả ▲":"Xem kết quả ▼"):<>🔬 Kiểm tra dinh dưỡng {nDays} ngày</>}
      </button>
      {open&&result&&(
        <div style={{marginTop:14,animation:"fadeIn 0.2s ease"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            {nutrKeys.map(n=>{
              const d=result.tong_quan?.[n.key]; if(!d) return null;
              return(
                <div key={n.key} style={{background:d.du?C.greenLt:"#FEF0F0",borderRadius:14,padding:"10px 12px",border:`2px solid ${d.du?C.green:"#FDD0D0"}`}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                    <span style={{fontSize:15}}>{d.du?"✅":"❌"}</span>
                    <span style={{fontWeight:800,fontSize:13,color:d.du?C.greenDk:"#C0392B"}}>{n.label}</span>
                  </div>
                  <div style={{fontSize:11,color:C.muted,lineHeight:1.4}}>{d.note}</div>
                </div>
              );
            })}
          </div>
          {result.khuyen_nghi?.length>0&&(
            <div style={{background:"#FFF8E1",borderRadius:14,padding:"12px 14px",marginBottom:10,borderLeft:"3px solid #F59E0B"}}>
              <div style={{fontWeight:800,fontSize:13,color:"#B07A10",marginBottom:8}}>💡 Khuyến nghị bổ sung</div>
              {result.khuyen_nghi.map((r,i)=>(
                <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:5}}>
                  <div style={{width:6,height:6,borderRadius:3,background:"#F59E0B",marginTop:5,flexShrink:0}}/>
                  <div style={{fontSize:12,color:"#8B6B2A",lineHeight:1.5,fontWeight:600}}>{r}</div>
                </div>
              ))}
            </div>
          )}
          {result.tong_ket&&(
            <div style={{background:"#F0EDF8",borderRadius:14,padding:"10px 14px",fontSize:13,color:"#5B4E8D",fontWeight:600,lineHeight:1.6}}>
              📊 {result.tong_ket}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

                      )}
                      <button onClick={()=>onRemoveDish&&onRemoveDish(day.day,m.key,di)}
                        style={{background:"rgba(232,90,90,0.1)",border:"none",borderRadius:8,width:24,height:24,cursor:"pointer",fontSize:13,color:"#E85A5A",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",flexShrink:0}}>
                        ×
                      </button>
                    </div>
                  </div>
                ))}
                {addingMeal===m.key&&(
                  <AddDishInlinePicker
                    dishes={dishes}
                    onAdd={(dish)=>{onAddDish&&onAddDish(day.day,m.key,dish);setAddingMeal(null);}}
                    onClose={()=>setAddingMeal(null)}
                  />
                )}
              </div>
            );
          })}

          {day.note&&(
            <div style={{background:"#FFFBEA",borderRadius:12,padding:"9px 12px",borderLeft:"3px solid #E8C55A",display:"flex",gap:8,alignItems:"flex-start",marginBottom:8}}>
              <span style={{fontSize:13,flexShrink:0}}>💡</span>
              <div style={{fontSize:12,color:"#6B5B2A",fontWeight:600,lineHeight:1.55}}>{day.note}</div>
            </div>
          )}

          <NutritionPanel day={day} apiKey={apiKey}/>
        </div>
      )}

      {replacing&&(
        <ReplaceDishModal
          currentDish={replacing.dishName}
          dishes={dishes}
          cookedDishes={cookedDishes}
          onSelect={(newDish)=>{
            onReplaceDish(day.day, replacing.mealKey, replacing.dishIndex, newDish, replacing.dishName);
            setReplacing(null);
          }}
          onClose={()=>setReplacing(null)}
        />
      )}
    </div>
  );
}

// ─── Date Picker Modal (chọn ngày bắt đầu thực đơn) ─────────────────────────
function DatePickerModal({numDays, onConfirm, onClose}) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());
  const [selected, setSelected] = useState(null); // dateKey string

  const cells = getCalendarDays(year, month);
  const tk = todayKey();

  const prevMonth = ()=>{ if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = ()=>{ if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const fmtLabel = (dk)=>{
    if(!dk) return "";
    const [y,m,d]=dk.split("-").map(Number);
    return `${d} ${MONTHS_VI[m-1]}, ${y}`;
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target.classList.contains("modal-overlay")&&onClose()}>
      <div className="modal-sheet">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div>
            <div style={{fontWeight:900,fontSize:17,color:C.brown}}>📅 Chọn ngày bắt đầu</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Thực đơn sẽ được lưu vào lịch {numDays} ngày kể từ ngày bạn chọn</div>
          </div>
          <button onClick={onClose} style={{background:"#F5F0EA",border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>×</button>
        </div>

        {/* Month nav */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <button onClick={prevMonth} style={{background:C.greenLt,border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:18,color:C.greenDk,display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <div style={{fontWeight:900,fontSize:15,color:C.brown}}>{MONTHS_VI[month]} {year}</div>
          <button onClick={nextMonth} style={{background:C.greenLt,border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:18,color:C.greenDk,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>

        {/* Weekday headers */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
          {WEEKDAYS.map(w=>(
            <div key={w} style={{textAlign:"center",fontSize:10,fontWeight:800,color:C.muted,padding:"2px 0"}}>{w}</div>
          ))}
        </div>

        {/* Day cells */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:16}}>
          {cells.map((d,i)=>{
            if(!d) return <div key={`e${i}`}/>;
            const dk = dateKey(year,month,d);
            const isToday = dk===tk;
            const isSel = dk===selected;
            return (
              <button key={dk} onClick={()=>setSelected(isSel?null:dk)}
                style={{
                  background: isSel?C.green : isToday?C.greenLt : "transparent",
                  border: isToday&&!isSel ? `2px solid ${C.green}` : "2px solid transparent",
                  borderRadius:10, padding:"8px 2px", cursor:"pointer",
                  display:"flex",flexDirection:"column",alignItems:"center",
                  fontFamily:"inherit"
                }}>
                <span style={{fontSize:13,fontWeight:isToday||isSel?900:600,color:isSel?"white":isToday?C.greenDk:C.brown}}>{d}</span>
              </button>
            );
          })}
        </div>

        {selected && (
          <div style={{background:C.greenLt,borderRadius:14,padding:"10px 14px",marginBottom:14,border:`2px solid ${C.green}`,display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:18}}>✅</span>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:C.greenDk}}>Ngày bắt đầu: {fmtLabel(selected)}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:1}}>Thực đơn sẽ phủ {numDays} ngày: {fmtLabel(selected)} → {(()=>{const [y,m,d]=selected.split("-").map(Number);const end=new Date(y,m-1,d+numDays-1);return `${end.getDate()} ${MONTHS_VI[end.getMonth()]}, ${end.getFullYear()}`;})()}</div>
            </div>
          </div>
        )}

        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose} style={{flex:1,background:"#F5F0EA",border:"none",borderRadius:14,padding:"13px",fontFamily:"inherit",fontWeight:700,fontSize:14,color:C.muted,cursor:"pointer"}}>Hủy</button>
          <button onClick={()=>selected&&onConfirm(selected)} disabled={!selected}
            style={{flex:2,background:selected?`linear-gradient(135deg,${C.green},${C.greenDk})`:"#B0C4B8",color:"white",border:"none",borderRadius:14,padding:"13px",fontFamily:"inherit",fontWeight:800,fontSize:14,cursor:selected?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            ✨ Tạo thực đơn ngay
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Calendar Helpers ─────────────────────────────────────────────────────────
const WEEKDAYS = ["CN","T2","T3","T4","T5","T6","T7"];
const MONTHS_VI = ["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];

function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function todayKey(){ const t=new Date(); return dateKey(t.getFullYear(),t.getMonth(),t.getDate()); }

function getCalendarDays(year, month) {
  const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  return cells;
}

// ─── Log Meal Modal ───────────────────────────────────────────────────────────
function LogMealModal({dateLabel, dateK, entry, dishes, onSave, onDelete, onClose}) {
  const [bf, setBf] = useState(entry?.breakfast||"");
  const [lu, setLu] = useState(entry?.lunch||"");
  const [di, setDi] = useState(entry?.dinner||"");
  const [nt, setNt] = useState(entry?.note||"");
  const [pickFor, setPickFor] = useState(null); // "breakfast"|"lunch"|"dinner"
  const [dishSearch, setDishSearch] = useState("");
  const searchRef = useRef(null);

  const openPicker = (key) => {
    if(pickFor === key){ setPickFor(null); setDishSearch(""); }
    else { setPickFor(key); setDishSearch(""); setTimeout(()=>searchRef.current&&searchRef.current.focus(),80); }
  };

  const addDish = (meal, dish) => {
    const setter = meal==="breakfast"?setBf:meal==="lunch"?setLu:setDi;
    const val = meal==="breakfast"?bf:meal==="lunch"?lu:di;
    setter(val ? val+", "+dish : dish);
    setDishSearch("");
    searchRef.current&&searchRef.current.focus();
  };

  const filteredDishes = dishSearch.trim()
    ? dishes.filter(d=>d.toLowerCase().includes(dishSearch.toLowerCase().trim()))
    : dishes;

  const meals = [
    {key:"breakfast",icon:"🌅",label:"Bữa sáng",val:bf,set:setBf,ph:"VD: Cháo thịt bằm, trứng luộc..."},
    {key:"lunch",icon:"☀️",label:"Bữa trưa",val:lu,set:setLu,ph:"VD: Cơm trắng, cá kho, canh cải..."},
    {key:"dinner",icon:"🌙",label:"Bữa tối",val:di,set:setDi,ph:"VD: Cơm trắng, thịt heo kho trứng..."},

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div>
            <div style={{fontWeight:900,fontSize:17,color:C.brown}}>📅 Ghi nhật ký ăn uống</div>
            <div style={{fontSize:13,color:C.green,fontWeight:700,marginTop:2}}>{dateLabel}</div>

          <button onClick={onClose} style={{background:"#F5F0EA",border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>×</button>
        </div>

        {meals.map(m=>(

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{fontWeight:700,fontSize:13,color:C.brown}}>{m.icon} {m.label}</div>
              <button onClick={()=>openPicker(m.key)}
                style={{background:pickFor===m.key?C.green:C.greenLt,border:"none",borderRadius:10,padding:"3px 10px",fontSize:11,fontWeight:700,color:pickFor===m.key?"white":C.greenDk,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>
                {pickFor===m.key?"✕ Đóng":"+ Chọn từ món ăn"}
              </button>
            </div>
            <textarea value={m.val} onChange={e=>m.set(e.target.value)} placeholder={m.ph} style={taStyle}/>
            {pickFor===m.key&&(
              <div style={{marginTop:8,background:"#F8F5F0",borderRadius:14,padding:"10px 10px 6px",border:`1.5px solid ${C.border}`}}>
                {/* Search input */}
                <div style={{position:"relative",marginBottom:8}}>
                  <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,pointerEvents:"none"}}>🔍</span>
                  <input
                    ref={searchRef}
                    value={dishSearch}
                    onChange={e=>setDishSearch(e.target.value)}
                    placeholder="Gõ tên món để tìm nhanh..."
                    style={{width:"100%",border:`2px solid ${dishSearch?C.green:C.border}`,borderRadius:10,padding:"8px 10px 8px 32px",fontFamily:"inherit",fontSize:13,outline:"none",color:C.brown,background:"white",transition:"border-color 0.15s",boxSizing:"border-box"}}
                  />
                  {dishSearch&&(
                    <button onClick={()=>setDishSearch("")}
                      style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:14,color:C.muted,padding:0,lineHeight:1}}>×</button>
                  )}
                </div>
                {/* Result count */}
                {dishSearch.trim()&&(
                  <div style={{fontSize:11,color:C.muted,fontWeight:600,marginBottom:6,paddingLeft:2}}>
                    {filteredDishes.length>0?`${filteredDishes.length} kết quả cho "${dishSearch}"`:"Không tìm thấy món nào"}

                )}
                {/* Suggestions */}
                <div style={{display:"flex",flexWrap:"wrap",gap:6,maxHeight:140,overflowY:"auto",padding:"2px 0 4px"}}>
                  {filteredDishes.length===0&&dishSearch.trim()&&(

                      Thử từ khóa khác hoặc nhập thẳng vào ô bên trên
                    </div>
                  )}
                  {filteredDishes.map((d,i)=>{

                        <span style={{fontSize:13}}>{getDishEmoji(d)}</span>

                            {name.slice(idx+query.length)}

        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:C.brown,marginBottom:6}}>📝 Ghi chú thêm</div>
          <textarea value={nt} onChange={e=>setNt(e.target.value)} placeholder="Hôm nay cảm thấy thế nào? Ăn ngon không?..." style={{...taStyle,minHeight:44}}/>
        </div>

        <div style={{display:"flex",gap:8}}>
          {entry&&(
            <button onClick={onDelete} style={{background:"#FEF0F0",border:"none",borderRadius:12,padding:"11px 14px",fontFamily:"inherit",fontWeight:700,fontSize:13,color:"#C0392B",cursor:"pointer"}}>🗑️</button>
          )}
          <button onClick={onClose} style={{flex:1,background:"#F5F0EA",border:"none",borderRadius:12,padding:"11px",fontFamily:"inherit",fontWeight:700,fontSize:14,color:C.muted,cursor:"pointer"}}>Hủy</button>
          <button onClick={()=>onSave({breakfast:bf.trim(),lunch:lu.trim(),dinner:di.trim(),note:nt.trim()})}
            style={{flex:2,background:C.green,border:"none",borderRadius:12,padding:"11px",fontFamily:"inherit",fontWeight:700,fontSize:14,color:"white",cursor:"pointer"}}>
            💾 Lưu nhật ký
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Diary Nutrition Analysis ─────────────────────────────────────────────────
function DiaryNutritionAnalysis({entry, dateLabel, apiKey}) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [open, setOpen] = useState(false);

  const allMeals = [entry.breakfast, entry.lunch, entry.dinner].filter(Boolean).join("; ");

  const analyze = async()=>{
    if(!apiKey?.trim()){alert("Cần nhập Groq API Key ở tab Thực đơn!");return;}
    if(!allMeals.trim()){alert("Chưa có bữa ăn nào được ghi!");return;}
    setLoading(true);
    try{
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile", max_tokens:1400, temperature:0.4,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng mẹ bầu 3 tháng đầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick."},
            {role:"user",content:`Hôm nay mẹ bầu 3 tháng đầu ăn:\n- Sáng: ${entry.breakfast||"không ghi"}\n- Trưa: ${entry.lunch||"không ghi"}\n- Tối: ${entry.dinner||"không ghi"}\n\nHãy:\n1. Phân tích từng món ăn cung cấp những dưỡng chất gì (liệt kê 2-4 dưỡng chất chính)\n2. Đánh giá tổng thể cả ngày đã đủ chưa\n3. Chỉ ra những gì còn thiếu\n4. Gợi ý thực đơn ngày mai để bù đắp\n\nTrả về JSON:\n{"phan_tich_mon":[{"ten_mon":"tên món","duong_chat":["Protein","Sắt","Canxi"]}],"danh_gia":{"du":["protein","vitamin C"],"thieu":["sắt","omega-3","canxi"],"nhan_xet":"nhận xét ngắn 1-2 câu về hôm nay"},"ngay_mai":{"sang":["tên món 1","tên món 2"],"trua":["Cơm trắng","tên món mặn","tên canh","tên trái cây"],"toi":["Cơm trắng","tên món mặn","tên canh","tên trái cây"],"ly_do":"lý do chọn thực đơn ngày mai để bù dưỡng chất còn thiếu"}}`}
          ]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"Lỗi API");
      const text = data.choices?.[0]?.message?.content||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setResult(parsed); setOpen(true);
    }catch(e){alert("Lỗi phân tích: "+e.message);}
    setLoading(false);
  };

  const reanalyze = ()=>{ setResult(null); setOpen(false); analyze(); };

  // Màu tag dưỡng chất theo tên
  const dcColor = (dc)=>{
    const d = dc.toLowerCase();
    if(d.includes("protein")) return {bg:"#E8F5E9",color:"#2E7D32",border:"#A5D6A7"};
    if(d.includes("sắt")||d.includes("sat")) return {bg:"#FEF0F0",color:"#C0392B",border:"#FDD0D0"};
    if(d.includes("canxi")||d.includes("calcium")) return {bg:"#E3F2FD",color:"#1565C0",border:"#90CAF9"};
    if(d.includes("folic")||d.includes("folate")) return {bg:"#F3E5F5",color:"#7B1FA2",border:"#CE93D8"};
    if(d.includes("omega")) return {bg:"#E0F7FA",color:"#00838F",border:"#80DEEA"};
    if(d.includes("vitamin c")||d.includes("vit c")) return {bg:"#FFF8E1",color:"#F57F17",border:"#FFE082"};
    if(d.includes("vitamin d")||d.includes("vit d")) return {bg:"#FFF3E0",color:"#E65100",border:"#FFCC80"};
    if(d.includes("kẽm")||d.includes("zinc")) return {bg:"#E8EAF6",color:"#283593",border:"#9FA8DA"};
    if(d.includes("chất xơ")||d.includes("fiber")) return {bg:"#F1F8E9",color:"#558B2F",border:"#AED581"};
    return {bg:"#F5F5F5",color:"#555",border:"#DDD"};
  };

  return(
    <div style={{marginTop:10}}>
      <div style={{display:"flex",gap:6}}>
        <button onClick={result?()=>setOpen(!open):analyze} disabled={loading}
          style={{flex:1,background:loading?"#ccc":result?C.greenLt:`linear-gradient(135deg,#5B9B6E,#3D7A54)`,color:result?C.greenDk:"white",border:result?`2px solid ${C.green}`:"none",borderRadius:12,padding:"10px",fontFamily:"inherit",fontWeight:700,fontSize:13,cursor:loading?"wait":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,transition:"all 0.2s"}}>
          {loading
            ?<><span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⏳</span>AI đang phân tích...</>
            :result?(open?"Thu gọn ▲":"🔬 Xem phân tích dinh dưỡng ▼"):"🔬 Phân tích dinh dưỡng hôm nay"
          }
        </button>
        {result&&!loading&&(
          <button onClick={reanalyze}
            title="Phân tích lại sau khi sửa nhật ký"
            style={{background:"#F5F0EA",border:`1.5px solid ${C.border}`,borderRadius:12,padding:"10px 12px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:C.muted,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
            🔄 Phân tích lại
          </button>
        )}
      </div>

      {open&&result&&(
        <div style={{background:"#F4FAF6",borderRadius:14,padding:"13px",marginTop:8,animation:"fadeIn 0.2s ease"}}>

          {/* Phân tích từng món */}
          {result.phan_tich_mon?.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{fontWeight:800,fontSize:13,color:C.brown,marginBottom:8}}>🍽️ Dinh dưỡng từng món</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {result.phan_tich_mon.map((mon,i)=>(
                  <div key={i} style={{background:"white",borderRadius:10,padding:"8px 10px",display:"flex",gap:8,alignItems:"flex-start"}}>
                    <span style={{fontSize:16,flexShrink:0,lineHeight:1.3}}>{getDishEmoji(mon.ten_mon)}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:800,color:C.brown,marginBottom:5,lineHeight:1.3}}>{mon.ten_mon}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                        {(mon.duong_chat||[]).map((dc,j)=>{
                          const cl=dcColor(dc);
                          return(
                            <span key={j} style={{background:cl.bg,color:cl.color,borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:800,border:`1px solid ${cl.border}`,lineHeight:1.5}}>{dc}</span>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Đánh giá tổng thể */}
          <div style={{marginBottom:12}}>
            <div style={{fontWeight:800,fontSize:13,color:C.brown,marginBottom:8}}>📊 Đánh giá tổng thể hôm nay</div>
            {result.danh_gia?.du?.length>0&&(
              <div style={{marginBottom:6}}>
                <div style={{fontSize:11,fontWeight:700,color:C.greenDk,marginBottom:4}}>✅ Đã đủ</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {result.danh_gia.du.map((n,i)=>(
                    <span key={i} style={{background:C.greenLt,color:C.greenDk,borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700,border:`1px solid ${C.green}`}}>{n}</span>
                  ))}
                </div>
              </div>
            )}
            {result.danh_gia?.thieu?.length>0&&(
              <div style={{marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:700,color:"#C0392B",marginBottom:4}}>❌ Còn thiếu</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {result.danh_gia.thieu.map((n,i)=>(
                    <span key={i} style={{background:"#FEF0F0",color:"#C0392B",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700,border:"1px solid #FDD0D0"}}>{n}</span>
                  ))}
                </div>
              </div>
            )}
            {result.danh_gia?.nhan_xet&&(
              <div style={{background:"white",borderRadius:10,padding:"8px 10px",fontSize:12,color:"#5B4E8D",fontWeight:600,lineHeight:1.6}}>
                💡 {result.danh_gia.nhan_xet}
              </div>
            )}
          </div>

          {/* Gợi ý ngày mai */}
          {result.ngay_mai&&(
            <div style={{background:"white",borderRadius:12,padding:"12px",border:`2px solid ${C.green}`}}>
              <div style={{fontWeight:800,fontSize:13,color:C.brown,marginBottom:10}}>🌟 Gợi ý thực đơn ngày mai</div>
              {[
                {key:"sang",icon:"🌅",label:"Sáng"},
                {key:"trua",icon:"☀️",label:"Trưa"},
                {key:"toi",icon:"🌙",label:"Tối"},
              ].map(m=>{
                const arr=result.ngay_mai[m.key];
                if(!arr||arr.length===0) return null;
                return(
                  <div key={m.key} style={{marginBottom:8}}>
                    <span style={{fontSize:11,fontWeight:800,color:C.greenDk}}>{m.icon} {m.label}: </span>
                    <span style={{fontSize:12,color:C.brown,fontWeight:600}}>
                      {(Array.isArray(arr)?arr:[arr]).join(", ")}
                    </span>
                  </div>
                );
              })}
              {result.ngay_mai?.ly_do&&(
                <div style={{background:"#FFF8E1",borderRadius:9,padding:"7px 10px",marginTop:6,fontSize:11,color:"#8B6B2A",fontWeight:600,lineHeight:1.6,borderLeft:"3px solid #F59E0B"}}>
                  💡 {result.ngay_mai.ly_do}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Calendar Tab ─────────────────────────────────────────────────────────────
function CalendarTab({diary, dishes, onSave, onDelete, apiKey}) {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());
  const [selected, setSelected] = useState(null); // dateKey string
  const [detailDate, setDetailDate] = useState(null); // for expanded day view

  const cells = getCalendarDays(year, month);
  const tk = todayKey();

  const prevMonth = ()=>{ if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = ()=>{ if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const fmtDateLabel = (dk)=>{
    const [y,m,d] = dk.split("-").map(Number);
    return `${d} ${MONTHS_VI[m-1]}, ${y}`;
  };

  const diaryEntries = Object.entries(diary).sort((a,b)=>b[0].localeCompare(a[0]));
  const thisMonthEntries = diaryEntries.filter(([k])=>k.startsWith(`${year}-${String(month+1).padStart(2,"0")}`));

  const MealLine = ({icon,val})=> val ? (
    <div style={{display:"flex",gap:5,alignItems:"flex-start",marginBottom:3}}>
      <span style={{fontSize:11,flexShrink:0,marginTop:1}}>{icon}</span>
      <span style={{fontSize:11,color:C.brown,fontWeight:600,lineHeight:1.4,flex:1}}>{val}</span>
    </div>

  return (
    <div>

      <div style={{background:C.card,borderRadius:24,padding:16,marginBottom:12,boxShadow:"0 4px 20px rgba(0,0,0,0.08)"}}>

          <div style={{textAlign:"center"}}>
            <div style={{fontWeight:900,fontSize:16,color:C.brown}}>{MONTHS_VI[month]} {year}</div>

          </div>
          <button onClick={nextMonth} style={{background:C.greenLt,border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:18,color:C.greenDk,display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>

        {/* Weekday headers */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
          {WEEKDAYS.map(w=>(
            <div key={w} style={{textAlign:"center",fontSize:10,fontWeight:800,color:C.muted,padding:"2px 0"}}>{w}</div>
          ))}
        </div>

            if(!d) return <div key={`e${i}`}/>;

                  position:"relative",
                  background: isSel?C.green : isToday?C.greenLt : "transparent",
                  border: isToday&&!isSel ? `2px solid ${C.green}` : "2px solid transparent",
                  borderRadius:10,
                  padding:"6px 2px",
                  cursor:"pointer",
                  display:"flex",flexDirection:"column",alignItems:"center",gap:2,
                  fontFamily:"inherit"
                }}>
                <span style={{fontSize:13,fontWeight:isToday||isSel?900:600,color:isSel?"white":isToday?C.greenDk:C.brown}}>{d}</span>
                {hasEntry && (
                  <div style={{width:5,height:5,borderRadius:3,background:isSel?"rgba(255,255,255,0.8)":C.green}}/>

              {diary[selected]?"✏️ Sửa":"+ Ghi nhật ký"}
            </button>

// ─── Quick Plan Modal (tham khảo, không lưu) ─────────────────────────────────
function QuickPlanModal({ingredients, apiKey, onClose}) {
  const [days, setDays] = useState(1);
  const [plan, setPlan] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const generate = async()=>{
    if(!apiKey||!apiKey.trim()){setError("Cần nhập Groq API Key ở tab Thực đơn trước nhé!");return;}
    const avail = ingredients.filter(i=>i.available);
    if(avail.length===0){setError("Chưa có nguyên liệu nào được tích!");return;}
    setLoading(true); setError(null); setPlan(null);
    try {
      const available = avail.map(i=>i.name).join(", ");
      const prompt = `Gợi ý thực đơn ${days} ngày cho mẹ bầu 3 tháng đầu, ưu tiên dùng các nguyên liệu sau: ${available}. Mỗi ngày 3 bữa (sáng nhẹ 2 món, trưa/tối 3-4 món). Bữa trưa và tối phải có "Cơm trắng". Chỉ trả về JSON hợp lệ, không markdown: {"days":[{"day":1,"breakfast":["món1","món2"],"lunch":["Cơm trắng","món1","món2"],"dinner":["Cơm trắng","món1","món2"]}]}`;
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:1200,temperature:0.75,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng mẹ bầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick."},
            {role:"user",content:prompt}
          ]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"Lỗi API");
      const text = data.choices?.[0]?.message?.content||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setPlan(parsed);
    } catch(e){ setError("Lỗi: "+e.message); }
    setLoading(false);
  };

  const ML = {
    breakfast:{icon:"🌅",label:"Sáng",bg:"#FFF3EA",accent:"#F5A67D"},
    lunch:{icon:"☀️",label:"Trưa",bg:"#EAF5EF",accent:"#5B9B6E"},
    dinner:{icon:"🌙",label:"Tối",bg:"#F0EDF8",accent:"#7B6BAD"}
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target.classList.contains("modal-overlay")&&onClose()}>
      <div className="modal-sheet">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div>
            <div style={{fontWeight:900,fontSize:17,color:C.brown}}>🥗 Gợi ý món từ nguyên liệu</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Tham khảo · không lưu vào thực đơn chính</div>
          </div>
          <button onClick={onClose} style={{background:"#F5F0EA",border:"none",borderRadius:12,width:36,height:36,cursor:"pointer",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>×</button>
        </div>
        <div style={{background:"#FFFBEA",borderRadius:14,padding:"9px 13px",marginBottom:14,borderLeft:"3px solid #E8C55A",fontSize:12,color:"#8B6B2A",fontWeight:600,lineHeight:1.6}}>
          💡 Gợi ý tham khảo nhanh — không ảnh hưởng thực đơn chính của bạn.
        </div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[1,2,3].map(n=>(
            <button key={n} onClick={()=>setDays(n)}
              style={{flex:1,border:`2px solid ${days===n?C.green:C.border}`,background:days===n?C.greenLt:C.card,color:days===n?C.greenDk:C.muted,borderRadius:14,padding:"10px 4px",fontFamily:"inherit",fontWeight:700,fontSize:14,cursor:"pointer"}}>
              {n} ngày
            </button>
          ))}
        </div>
        <button onClick={generate} disabled={loading}
          style={{width:"100%",background:loading?"#B0C4B8":`linear-gradient(135deg,${C.green},${C.greenDk})`,color:"white",border:"none",borderRadius:14,padding:"13px",fontFamily:"inherit",fontWeight:800,fontSize:15,cursor:loading?"not-allowed":"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          {loading?<><span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⏳</span> Đang tạo...</>:<>✨ Tạo gợi ý</>}
        </button>
        {error&&<div style={{background:"#FEF0F0",borderRadius:14,padding:14,color:"#C0392B",fontSize:13,fontWeight:600,marginBottom:12,lineHeight:1.6}}>{error}</div>}
        {plan&&plan.days?.map(day=>(
          <div key={day.day} style={{background:C.card,borderRadius:18,padding:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
            <div style={{fontWeight:800,fontSize:14,color:C.brown,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:30,height:30,borderRadius:10,background:C.greenLt,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,color:C.greenDk}}>{day.day}</div>
              Ngày {day.day}
            </div>
            {["breakfast","lunch","dinner"].map(mk=>{
              const m=ML[mk];
              const arr=Array.isArray(day[mk])?day[mk]:(day[mk]?[day[mk]]:[]);
              return (
                <div key={mk} style={{background:m.bg,borderRadius:12,padding:"8px 12px",marginBottom:6,borderLeft:`3px solid ${m.accent}`}}>
                  <div style={{fontSize:11,fontWeight:800,color:m.accent,marginBottom:6,textTransform:"uppercase",letterSpacing:0.8}}>{m.icon} {m.label}</div>
                  {arr.map((dish,i)=>(
                    <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:i<arr.length-1?4:0}}>
                      <span style={{fontSize:14,flexShrink:0}}>{getDishEmoji(dish)}</span>
                      <span style={{fontSize:13,fontWeight:700,color:C.brown,lineHeight:1.35}}>{dish}</span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Dishes Tab ───────────────────────────────────────────────────────────────
function DishesTab({dishes,cookedDishes,removeDish,onDishClick,onToggleCooked,onAddDish,favoriteDishes,onToggleFav,ingredients,apiKey}) {
  const [searchQuery, setSearchQuery] = useState("");
  const [dishFilter, setDishFilter] = useState("all"); // "all" | "fav" | "user"
  const [showAddModal, setShowAddModal] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState(null); // {dishes:[...], error:null}
  const cookedCount = dishes.filter(d=>cookedDishes.includes(d)).length;
  const favCount = favoriteDishes.length;
  const userDishes = dishes.filter(d=>!DEFAULT_DISHES.includes(d));

  const baseList = dishFilter==="fav"
    ? dishes.filter(d=>favoriteDishes.includes(d))
    : dishFilter==="user"
      ? userDishes
      : dishes;
  const filtered = searchQuery.trim()
    ? baseList.filter(d=>d.toLowerCase().includes(searchQuery.toLowerCase()))
    : baseList;

  const generateAIDishes = async()=>{
    if(!apiKey||!apiKey.trim()){alert("Cần nhập Groq API Key ở tab Thực đơn trước nhé!");return;}
    // Chỉ dùng nguyên liệu đã được tích chọn (available)
    const availIng = (ingredients||[]).filter(i=>i.available);
    if(availIng.length===0){
      alert("Chưa có nguyên liệu nào được tích ✓!\n\nVào tab Nguyên liệu tích chọn những gì bạn mua được trước nhé.");
      return;
    }
    setAiLoading(true); setAiResult(null);
    try {
      const ingByCategory = {};
      availIng.forEach(i=>{ if(!ingByCategory[i.category]) ingByCategory[i.category]=[]; ingByCategory[i.category].push(i.name); });
      const ingText = Object.entries(ingByCategory).map(([cat,items])=>`${cat}: ${items.join(", ")}`).join("\n");
      const existingDishes = dishes.join(", ");
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey.trim()},
        body:JSON.stringify({
          model:"llama-3.3-70b-versatile",
          max_tokens:900,
          temperature:0.85,
          messages:[
            {role:"system",content:"Bạn là chuyên gia dinh dưỡng cho mẹ bầu 3 tháng đầu. Chỉ trả về JSON hợp lệ, không markdown, không backtick, không giải thích thêm."},
            {role:"user",content:`Nguyên liệu tôi đang CÓ SẴN (chỉ dùng những nguyên liệu này, không thêm nguyên liệu ngoài danh sách):\n${ingText}\n\nCác món ăn đã có (KHÔNG được trùng): ${existingDishes||"Chưa có"}\n\nHãy gợi ý 12 món ăn đa dạng (món mặn, canh, cháo, hạt/đậu, rau) phù hợp cho mẹ bầu 3 tháng đầu. BẮT BUỘC chỉ dùng nguyên liệu trong danh sách trên.\nTrả về JSON: {"mon_an":["tên món 1","tên món 2",...]} (đúng 12 món, mỗi tên ngắn gọn dưới 40 ký tự)`}
          ]
        })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error.message||"Lỗi API");
      const text = data.choices?.[0]?.message?.content||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      const newDishes = (parsed.mon_an||[]).filter(d=>d&&!dishes.includes(d));
      setAiResult({dishes:newDishes, error:null});
    } catch(e){
      setAiResult({dishes:[], error:"Lỗi: "+e.message});
    }
    setAiLoading(false);
  };

  const addAIDish = (dish)=>{
    onAddDish&&onAddDish(dish, null);
    setAiResult(prev=>prev?{...prev, dishes:prev.dishes.filter(d=>d!==dish)}:prev);
  };

  const addAllAIDishes = ()=>{
    if(!aiResult?.dishes?.length) return;
    aiResult.dishes.forEach(d=>onAddDish&&onAddDish(d,null));
    setAiResult(null);
  };

  return (
    <div>
      <div style={{background:C.card,borderRadius:24,padding:16,marginBottom:12,boxShadow:"0 4px 20px rgba(0,0,0,0.08)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:C.brown}}>🍜 Kho món ăn</div>
            <div style={{fontSize:13,color:C.muted,marginTop:2}}>{dishes.length} món · Nhấn để xem/sửa công thức</div>
          </div>
          <div style={{display:"flex",gap:6}}>
            {favCount>0&&(
              <div style={{background:"#FFF8E1",borderRadius:12,padding:"5px 10px",textAlign:"center"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#E8A020"}}>⭐ {favCount} yêu thích</div>
              </div>
            )}
            {cookedCount>0&&(
              <div style={{background:"#FEF0F0",borderRadius:12,padding:"5px 10px",textAlign:"center"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#E85A5A"}}>✓ {cookedCount} đã nấu</div>
              </div>
            )}
          </div>
        </div>

        <div style={{background:"#EAF5EF",borderRadius:12,padding:"9px 12px",marginBottom:10,fontSize:12,color:C.greenDk,fontWeight:600,lineHeight:1.5,border:`1px solid ${C.green}`}}>
          📋 Khi tạo thực đơn, AI sẽ <b>chỉ chọn từ kho món này</b>. Thêm càng nhiều món, thực đơn càng đa dạng.

    </div>
  );
}

// ─── History Tab ──────────────────────────────────────────────────────────────
function HistoryTab({history, onDelete, onClearAll, onRestore}) {
  const [expandedIdx, setExpandedIdx] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);

  const fmtDate=(iso)=>{
    if(!iso) return "Không rõ ngày";
    const d=new Date(iso);
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} lúc ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  };

  const mealColors={breakfast:{icon:"🌅",label:"Sáng",color:"#F5A67D"},lunch:{icon:"☀️",label:"Trưa",color:"#5B9B6E"},dinner:{icon:"🌙",label:"Tối",color:"#7B6BAD"}};

  if(history.length===0) return(
    <div style={{textAlign:"center",padding:"60px 20px",color:C.muted}}>
      <div style={{fontSize:48,marginBottom:14}}>📜</div>
      <div style={{fontWeight:800,fontSize:17,color:C.brown,marginBottom:8}}>Chưa có lịch sử</div>
      <div style={{fontSize:14,lineHeight:1.7}}>Sau khi tạo thực đơn, lịch sử sẽ được lưu tại đây</div>
    </div>
  );

  return(
    <div>
      {/* Header card */}
      <div style={{background:C.card,borderRadius:24,padding:"16px 18px",marginBottom:12,boxShadow:"0 4px 20px rgba(0,0,0,0.08)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:C.brown}}>📜 Lịch sử thực đơn</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>{history.length} đợt đã tạo · Mới nhất hiển thị trước</div>
          </div>
          {!confirmClear?(
            <button onClick={()=>setConfirmClear(true)}
              style={{background:"#FEF0F0",color:"#C0392B",border:"2px solid #FDD0D0",borderRadius:12,padding:"7px 12px",fontFamily:"inherit",fontWeight:700,fontSize:12,cursor:"pointer"}}>
              🗑️ Xóa tất cả
            </button>
          ):(
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setConfirmClear(false)} style={{background:"#F5F0EA",border:"none",borderRadius:10,padding:"6px 10px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:C.muted,cursor:"pointer"}}>Hủy</button>
              <button onClick={()=>{onClearAll();setConfirmClear(false);}} style={{background:"#C0392B",border:"none",borderRadius:10,padding:"6px 12px",fontFamily:"inherit",fontWeight:700,fontSize:12,color:"white",cursor:"pointer"}}>Xác nhận xóa</button>
            </div>
          )}
        </div>
      </div>

      {/* List */}
      {[...history].reverse().map((plan, revIdx)=>{
        const idx = history.length - 1 - revIdx;
        const isExp = expandedIdx === idx;
        const numD = plan.days?.length || plan.numDays || "?";
        return(
          <div key={idx} style={{background:C.card,borderRadius:20,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
            {/* Plan header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                  <div style={{background:C.greenLt,borderRadius:10,padding:"3px 10px",fontSize:12,fontWeight:800,color:C.greenDk}}>{numD} ngày</div>
                  <div style={{fontSize:11,color:C.muted,fontWeight:600}}>{fmtDate(plan.generatedAt)}</div>
                </div>
                {plan.days?.[0]&&(
                  <div style={{fontSize:12,color:C.brown,fontWeight:600,lineHeight:1.5}}>
                    {(()=>{
                      const flatten=v=>Array.isArray(v)?v:(v?[v]:[]);
                      const d0=plan.days[0];
                      const preview=[...flatten(d0.lunch),...flatten(d0.dinner)].filter(d=>d&&d!=="Cơm trắng").slice(0,3);
                      return preview.join(" · ")||"Thực đơn đầy đủ";
                    })()}
                  </div>
                )}
              </div>
              <div style={{display:"flex",gap:6,marginLeft:8}}>
                <button onClick={()=>onRestore&&onRestore(plan)}
                  style={{background:C.greenLt,color:C.greenDk,border:`2px solid ${C.green}`,borderRadius:10,padding:"5px 10px",fontFamily:"inherit",fontWeight:700,fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>
                  📂 Dùng lại
                </button>
                <button onClick={()=>setExpandedIdx(isExp?null:idx)}
                  style={{background:"#F5F0EA",color:C.muted,border:"none",borderRadius:10,padding:"5px 10px",fontFamily:"inherit",fontWeight:700,fontSize:11,cursor:"pointer"}}>
                  {isExp?"Thu ▲":"Xem ▼"}
                </button>
                <button onClick={()=>onDelete(idx)}
                  style={{background:"#FEF0F0",color:"#E85A5A",border:"none",borderRadius:10,width:30,height:30,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  ×
                </button>
              </div>
            </div>

            {/* Expanded view */}
            {isExp&&plan.days&&(
              <div style={{animation:"fadeIn 0.2s ease"}}>
                <div style={{height:1,background:C.border,marginBottom:10}}/>
                {plan.days.map(day=>(
                  <div key={day.day} style={{marginBottom:10}}>
                    <div style={{fontWeight:800,fontSize:13,color:C.brown,marginBottom:6,display:"flex",alignItems:"center",gap:6}}>
                      <div style={{width:24,height:24,borderRadius:8,background:C.greenLt,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:12,color:C.greenDk}}>{day.day}</div>
                      Ngày {day.day}
                    </div>
                    {["breakfast","lunch","dinner"].map(mk=>{
                      const m=mealColors[mk];
                      const flatten=v=>Array.isArray(v)?v:(v?[v]:[]);
                      const arr=flatten(day[mk]).filter(Boolean);
                      if(arr.length===0) return null;
                      return(
                        <div key={mk} style={{marginBottom:5,paddingLeft:30}}>
                          <span style={{fontSize:11,fontWeight:700,color:m.color}}>{m.icon} {m.label}: </span>
                          <span style={{fontSize:11,color:C.brown,fontWeight:600}}>{arr.filter(d=>d!=="Cơm trắng").join(", ")}</span>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("ingredients"); // default to ingredients for onboarding
  const [ingredients, setIngredients] = useState(DEFAULT_INGREDIENTS);
  const [dishes, setDishes] = useState(DEFAULT_DISHES);

  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(false);
  const [numDays, setNumDays] = useState(3);
  const [catFilter, setCatFilter] = useState("Tất cả");
  const [groqKey, setGroqKey] = useState("");
  const [newIngName, setNewIngName] = useState("");
  const [newIngCat, setNewIngCat] = useState("Rau");
  const [showKey, setShowKey] = useState(false);
  const [cookedDishes, setCookedDishes] = useState([]);
  const [favoriteDishes, setFavoriteDishes] = useState([]);
  const [hasSeenIngredients, setHasSeenIngredients] = useState(false);
  const [selectedDish, setSelectedDish] = useState(null);
  const [dishRecipes, setDishRecipes] = useState({});
  const [diary, setDiary] = useState({});
  const [dishWarning, setDishWarning] = useState(null); // {missing:[], onlyFavs, onlyAvailIng, sameMeal, startDateKey}
  const [stage, setStage] = useState("3thangdau"); // stage selector
  const [showStageMenu, setShowStageMenu] = useState(false);

  const STAGES = [
    {id:"3thangdau", label:"3 tháng đầu thai kỳ", icon:"🤰"},
    {id:"sau3thang", label:"Sau 3 tháng đầu thai kỳ", icon:"🫄"},
    {id:"moisinhbé", label:"Mới sinh em bé", icon:"👶"},
    {id:"giađình", label:"Cả gia đình", icon:"👨‍👩‍👧‍👦"},
  ];

  useEffect(()=>{
    // Migrate from v2 if v3 doesn't exist
    const seen = db.load("mebau_seen_ing_v3");
    if(seen){ setHasSeenIngredients(true); setTab("menu"); }

    const i3=db.load("mebau_ing_v3");
    const i2=db.load("mebau_ing_v2");
    if(i3) setIngredients(i3);
    else if(i2) setIngredients(i2); // migrate from old version

    // Danh sách món mặc định cũ (để lọc ra, chỉ giữ món user tự thêm)
    const LEGACY_DEFAULT = new Set(["Thịt heo kho tiêu","Thịt heo luộc","Thịt heo xào gừng hành","Thịt bò xào cà rốt súp lơ","Thịt bò hầm rau củ","Thịt bò lúc lắc","Gà hấp gừng hành","Gà rang sả","Gà kho gừng","Gà hầm tiêu xanh","Vịt nấu chao","Vịt luộc mắm gừng","Chim bồ câu hầm hạt sen","Chim cút kho","Trứng chiên cà chua","Trứng gà luộc","Trứng cút kho","Trứng hấp thịt băm","Cá hồi áp chảo","Cá hồi sốt cà chua","Cá hồi hấp gừng","Cá nục kho gừng","Cá nục chiên","Cá trích kho","Cá thác lát chiên","Cá chim trắng kho","Cá liệt kho","Tôm luộc","Tôm xào tỏi","Tôm rang muối","Tôm hấp bia","Đậu khuôn chiên sốt cà chua","Đậu khuôn hấp hành gừng","Rau muống xào tỏi","Cải ngọt xào tỏi","Súp lơ xanh luộc","Bầu luộc","Cải thìa xào gừng","Đậu bắp luộc","Măng tây xào tỏi","Cải bó xôi xào tỏi","Khoai lang luộc","Canh rau cải bó xôi thịt băm","Canh bí đỏ tôm","Canh bí đao xương heo","Canh cải thảo tôm","Canh cải ngọt thịt băm","Canh đậu đũa thịt","Canh khoai tây thịt bò","Canh xương bò rau củ","Canh cà rốt thịt băm","Canh rau ngót thịt băm","Canh chua cá","Canh chua tôm","Súp bí đỏ gà","Súp gà rau củ","Bí đỏ hầm xương bò","Canh đậu hũ cải thảo","Canh hành tây thịt bò","Sữa đậu xanh","Sữa đậu nành","Sữa hạt óc chó","Chè đậu đen","Chè đậu đỏ","Chè đậu xanh đường phèn","Hạt điều rang muối","Hạt hướng dương rang","Cháo gà rau củ","Cháo đậu xanh","Cháo trứng rau","Cháo cá hồi"]);
    const d3=db.load("mebau_dishes_v3");
    const d2=db.load("mebau_dishes_v2");
    const rawDishes = d3||d2||[];
    const userOnlyDishes = rawDishes.filter(d=>!LEGACY_DEFAULT.has(d));
    setDishes(userOnlyDishes);
    if(userOnlyDishes.length !== rawDishes.length) {
      db.save("mebau_dishes_v3", userOnlyDishes);
    }

    const p=db.load("mebau_plan_v3"); if(p)setPlan(p);
    const h=db.load("mebau_hist_v3"); if(h)setHistory(h);
    const k=db.load("mebau_gkey"); if(k)setGroqKey(k);
    const c=db.load("mebau_cooked_v3"); if(c)setCookedDishes(c);
    const fav=db.load("mebau_fav_v3"); if(fav)setFavoriteDishes(fav);
    const r=db.load("mebau_recipes_v3"); if(r)setDishRecipes(r);
    const diary=db.load("mebau_diary_v3"); if(diary)setDiary(diary);
  },[]);

  const saveKey=(v)=>{ setGroqKey(v); db.save("mebau_gkey",v); };

  // Close stage menu when clicking outside
  useEffect(()=>{
    if(!showStageMenu) return;
    const handler=(e)=>{
      if(!e.target.closest("[data-stage-menu]")) setShowStageMenu(false);
    };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[showStageMenu]);

  const updateIng=(upd)=>{
    setIngredients(upd);
    db.save("mebau_ing_v3",upd);
